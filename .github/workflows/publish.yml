name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing (no stored secrets)
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python
        run: uv python install 3.12

      # A release cut from the wrong commit would publish whatever version is in
      # pyproject.toml under the release's tag -- and PyPI versions are immutable.
      - name: Verify tag matches project version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag '$TAG' does not match pyproject version 'v$VERSION'"
            exit 1
          fi

      # The Tests workflow gates merges, but a release can be cut from any commit;
      # re-run the free suite so an untested tree never reaches PyPI.
      - name: Run test suite
        run: |
          uv sync --locked
          uv run pytest tests/ -v

      - name: Build package
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      # Catch a wheel/sdist that's missing bundled files (remote/worker.py, the
      # embedded dashboard HTML) before anything is uploaded -- versions on PyPI
      # are immutable, so a broken artifact would burn the version number.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_test.py

      # Trusted Publishing (OIDC) + automatic PEP 740 attestations. uv build does
      # not generate attestations, so the upload stays on the PyPA action (kept on
      # its maintained moving tag, release/v1, per PyPA guidance).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
