name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing (no stored secrets)
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python
        run: uv python install 3.12

      # A release cut from the wrong commit would publish whatever version is in
      # pyproject.toml under the release's tag -- and PyPI versions are immutable.
      - name: Verify tag matches project version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag '$TAG' does not match pyproject version 'v$VERSION'"
            exit 1
          fi

      # uv's Git source overrides are local-resolution instructions, not
      # distributable Requires-Dist. Refuse a release until both canonical
      # requirements can actually be installed from the public index.
      - name: Verify extracted dependencies exist on PyPI
        run: |
          uv run --locked python - <<'PY'
          import json
          import tomllib
          import urllib.error
          import urllib.request
          from packaging.requirements import Requirement
          from packaging.version import Version

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          for name in ("pymc-monitor", "pymc-cache"):
              requirement = next(
                  Requirement(raw) for raw in project["dependencies"]
                  if Requirement(raw).name.lower().replace("_", "-") == name
              )
              try:
                  with urllib.request.urlopen(
                      f"https://pypi.org/pypi/{name}/json", timeout=15
                  ) as response:
                      releases = json.load(response)["releases"]
              except (urllib.error.URLError, KeyError) as exc:
                  raise SystemExit(f"{name} is unavailable from PyPI: {exc}") from exc
              available = [version for version, files in releases.items()
                           if files and Version(version) in requirement.specifier]
              if not available:
                  raise SystemExit(f"{name} has no PyPI release matching {requirement.specifier}")
          PY

      # The Tests workflow gates merges, but a release can be cut from any commit;
      # re-run the free suite so an untested tree never reaches PyPI.
      - name: Run test suite
        run: |
          uv sync --locked
          uv run --locked pytest tests/ -v

      - name: Build package
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      # Catch a wheel/sdist that's missing remote/worker.py or the monitor's
      # bundled dashboard assets before upload -- versions on PyPI
      # are immutable, so a broken artifact would burn the version number.
      # --prerelease=disallow: an isolated resolve otherwise picks prerelease
      # transitive deps (e.g. a numba beta that is incompatible with the numpy
      # it resolves alongside), failing the release on an upstream's beta.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --prerelease=disallow --with dist/*.whl scripts/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --prerelease=disallow --with dist/*.tar.gz scripts/smoke_test.py

      # Trusted Publishing (OIDC) + automatic PEP 740 attestations. uv build does
      # not generate attestations, so the upload stays on the PyPA action (kept on
      # its maintained moving tag, release/v1, per PyPA guidance).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
