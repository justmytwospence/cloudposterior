name: Modal e2e (paid)

# Manual only. These tests provision real Modal containers and cost money, so
# they never run on push or on a schedule.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Paid test scope (full suite requires explicit selection)"
        type: choice
        required: true
        default: extraction-smoke
        options:
          - extraction-smoke
          - full

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Requires MODAL_TOKEN_ID / MODAL_TOKEN_SECRET in this environment.
    environment: modal
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Modal e2e tests
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then
            echo "MODAL_TOKEN_ID is not configured; skipping."
            exit 1
          fi
          if [ "${{ inputs.suite }}" = "full" ]; then
            uv run --locked pytest tests/ -v --run-modal -m modal
          else
            uv run --locked pytest tests/test_extraction_modal.py -v --run-modal
          fi
      # Each extraction test tears down only its own isolated project; never
      # call cp.cleanup_volumes() without a project here (user data may exist).
