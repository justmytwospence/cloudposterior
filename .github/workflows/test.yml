name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      # Run the locked dev-group ruff, not whatever `uvx` resolves today: an
      # unpinned ruff turns a new upstream rule into a failure on an unrelated PR.
      - name: Lint with ruff
        run: |
          uv sync --locked
          uv run --locked ruff check cloudposterior/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # Exercise both arviz majors: PyMC 5 ships arviz 0.x, PyMC 6 requires
        # arviz 1.x (the DataTree rewrite). Modal e2e tests are not run in CI.
        pymc: ["5", "6"]
        exclude:
          # PyMC 5 is legacy; don't gate the release on it under the newest
          # Python. 3.13 is still covered by the PyMC 6 leg.
          - python-version: "3.13"
            pymc: "5"
          # PyMC 6 needs arviz 1.x, whose compatible nutpie (>=0.16.10) ships no
          # Python 3.11 wheel -- the combination is unsatisfiable. PyMC 6 is
          # covered on 3.12 and 3.13.
          - python-version: "3.11"
            pymc: "6"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      # Pin pymc AND arviz per leg so each major is exercised deterministically
      # (an unpinned resolve drifts to the newest arviz for both legs).
      - name: Run tests (PyMC ${{ matrix.pymc }})
        run: |
          if [ "${{ matrix.pymc }}" = "6" ]; then
            uv run --locked --python ${{ matrix.python-version }} \
              --with "pymc>=6,<7" --with "arviz>=1.1,<2.0" --with "nutpie>=0.16.10" \
              python -m pytest tests/ -v --cov=cloudposterior --cov-report=term-missing
          else
            if [ "${{ matrix.python-version }}" = "3.11" ]; then
              NUTPIE="nutpie==0.16.8"
            else
              NUTPIE="nutpie>=0.13"
            fi
            uv run --locked --python ${{ matrix.python-version }} \
              --with "pymc>=5.28,<6" --with "arviz>=0.18,<1.0" --with "$NUTPIE" \
              python -m pytest tests/ -v --cov=cloudposterior --cov-report=term-missing
          fi

      # Fail loudly on a coverage regression rather than printing a number
      # into the log that nobody reads. Raise the floor as coverage improves.
      - name: Enforce coverage floor
        if: matrix.python-version == '3.13' && matrix.pymc == '6'
        run: uv run --locked coverage report --fail-under=70

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install Python
        run: uv python install 3.12
      - name: Download the locked pymc-monitor and pymc-cache releases
        run: |
          uv run --no-project --python 3.12 --with pip python - <<'PY'
          import subprocess
          import sys
          import tomllib

          lock = tomllib.load(open("uv.lock", "rb"))
          for project in ("pymc-monitor", "pymc-cache"):
              entry = next(p for p in lock["package"] if p["name"] == project)
              if entry["source"].get("registry") != "https://pypi.org/simple":
                  raise SystemExit(f"{project} must be locked from PyPI, not {entry['source']}")
              spec = f"{project}=={entry['version']}"
              dest = f".ci-deps/{project}/dist"
              pip = [sys.executable, "-m", "pip", "download", "--no-deps", "-d", dest]
              subprocess.run([*pip, "--only-binary", ":all:", spec], check=True)
              subprocess.run([*pip, "--no-binary", ":all:", spec], check=True)
          PY
      - name: Build cloudposterior
        run: uv build --no-sources --out-dir dist
      - name: Verify metadata, included modules and assets
        run: |
          uv sync --locked
          uv run --locked python scripts/check_extraction_artifacts.py \
            --monitor .ci-deps/pymc-monitor/dist \
            --cache .ci-deps/pymc-cache/dist --cloud dist
      - name: Smoke all three installed wheels, not sibling source trees
        run: |
          uv run --isolated --no-project --prerelease=disallow \
            --with .ci-deps/pymc-monitor/dist/*.whl \
            --with .ci-deps/pymc-cache/dist/*.whl \
            --with dist/*.whl scripts/smoke_extraction.py
      - name: Smoke all three installed sdists
        run: |
          uv run --isolated --no-project --prerelease=disallow \
            --with .ci-deps/pymc-monitor/dist/*.tar.gz \
            --with .ci-deps/pymc-cache/dist/*.tar.gz \
            --with dist/*.tar.gz scripts/smoke_extraction.py
