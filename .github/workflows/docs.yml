name: Docs

on:
  push:
    branches: [main]
    paths: &docs_paths
      - "examples/**"
      - "cloudposterior/**"
      - "*.qmd"
      - "_quarto.yml"
      - "*.scss"
      - "scripts/build-docs.sh"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  # Build (but don't deploy) on PRs so a broken quartodoc/quarto render is
  # caught before merge rather than after.
  pull_request:
    paths: *docs_paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python
        run: uv python install 3.12

      # Installs the package (so quartodoc can import it) + dev + docs groups.
      # No Modal calls -- quartodoc only imports for introspection, and the site
      # renders with execution disabled.
      - name: Install dependencies
        run: uv sync --locked --group docs

      # Builds the quartodoc API reference and renders the site. The script
      # stashes the marimo examples/*.py during render (Quarto reads them as
      # Jupyter percent-scripts that collide with the paired .ipynb).
      - name: Build docs
        run: uv run bash scripts/build-docs.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    # PRs build only -- nothing is published until it lands on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
