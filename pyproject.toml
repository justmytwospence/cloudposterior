[project]
name = "cloudposterior"
version = "0.7.0"
description = "Run PyMC MCMC sampling on cloud VMs with one line of code. Caching, live progress, and phone notifications included."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Spencer Boucher" },
]
keywords = ["pymc", "mcmc", "bayesian", "cloud", "modal", "sampling"]
# No "License ::" classifier: PEP 639 makes it mutually exclusive with the
# license expression above, and PyPI rejects uploads that carry both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # <7 so a future major that changes the sampling API again can't silently
    # break installs; PyMC 5 and 6 are both supported (see _idata.pymc_major).
    "pymc>=5,<7",
    "arviz>=0.17,<2.0",
    "numpy>=1.24",
    # imported directly (api.py fingerprints SharedVariables); pymc pins the
    # actual version, this floor just makes the dependency explicit
    "pytensor>=2.18",
    "anywidget>=0.9",
    "cloudpickle>=3.0",
    "coolname>=4.0",
    "lz4>=4.0",
    # The backend uses Dict.objects/Volume.objects, fastapi_endpoint,
    # Cls.with_options(cpu=/memory=/gpu=) and scaledown_window -- all
    # Modal-1.x API surface, and none of it exercised in CI.
    "modal>=1.0,<2",
    "msgpack>=1.0",
    "qrcode>=7.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/justmytwospence/cloudposterior"
Documentation = "https://justmytwospence.github.io/cloudposterior/"
Repository = "https://github.com/justmytwospence/cloudposterior"
Issues = "https://github.com/justmytwospence/cloudposterior/issues"

[project.optional-dependencies]
# nutpie is the faster default sampler for local runs; remote images already
# bundle it, and the local path falls back to the pymc sampler without it.
nutpie = ["nutpie>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only test_*.py: scripts/smoke_test.py is run against the built artifact by
# the publish workflow, not collected here.
python_files = ["test_*.py"]
markers = [
    "modal: tests that hit Modal and incur cloud costs (skipped unless --run-modal)",
]
filterwarnings = [
    "default",
    # Our own deprecations should fail the suite rather than accumulate.
    "error::DeprecationWarning:cloudposterior.*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["cloudposterior"]
# Keep `from x import (a as b, c as d)` as one statement rather than splitting
# it into one import per alias.
combine-as-imports = true

[tool.hatch.build.targets.wheel]
packages = ["cloudposterior"]

# Hatchling's default sdist sweeps in examples/*.ipynb (~950 KB of embedded
# outputs), uv.lock, .github/ and the docs sources.
[tool.hatch.build.targets.sdist]
include = [
    "cloudposterior",
    "tests",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "nutpie>=0.13",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "graphviz>=0.20",
    "marimo>=0.13",
    "nbformat>=5.0",
]

docs = [
    # Pinned together: quartodoc 0.11 is incompatible with the griffe 2.x
    # parser API, so an unbounded quartodoc could pull a griffe this pin forbids
    # and deadlock the docs build.
    "quartodoc>=0.11,<0.12",
    "griffe<2.0",
]
