project:
  type: website
  output-dir: _site
  # Whitelist what gets rendered so README.md / CLAUDE.md / marimo .py files
  # are not turned into pages. `reference/` is generated by `quartodoc build`.
  render:
    - index.qmd
    - getting-started.qmd
    - examples/*.ipynb
    - reference/

# Never execute code at render time. The example notebooks sample on Modal
# (paid) and already carry embedded outputs, so we render those statically.
execute:
  enabled: false

website:
  title: "cloudposterior"
  description: "Run PyMC MCMC sampling on cloud VMs with one line of code."
  site-url: "https://justmytwospence.github.io/cloudposterior/"
  repo-url: "https://github.com/justmytwospence/cloudposterior"
  repo-actions: [issue]
  navbar:
    search: true
    left:
      - text: "Get started"
        href: getting-started.qmd
      - text: "Examples"
        href: examples/basics.ipynb
      - text: "API reference"
        href: reference/index.qmd
    right:
      - icon: github
        href: "https://github.com/justmytwospence/cloudposterior"
        aria-label: GitHub
      - text: PyPI
        href: "https://pypi.org/project/cloudposterior/"
  sidebar:
    style: floating
    contents:
      - text: Overview
        href: index.qmd
      - getting-started.qmd
      - section: Examples
        contents:
          - text: Cloud execution
            href: examples/basics.ipynb
          - text: Caching
            href: examples/caching.ipynb
          - text: Parallel fitting
            href: examples/parallelism.ipynb
          - text: Monitoring
            href: examples/monitoring.ipynb
      - section: API reference
        contents:
          - reference/index.qmd
          - reference/cloud.qmd
          - reference/sample.qmd
          - reference/map.qmd
          - reference/cleanup_volumes.qmd
          - reference/cleanup_cache.qmd
          - reference/config.RemoteConfig.qmd
          - reference/cache.MemoryCache.qmd
          - reference/cache.DiskCache.qmd
  page-footer:
    center: "MIT licensed &middot; Built with [Quarto](https://quarto.org)"
    right:
      - icon: github
        href: "https://github.com/justmytwospence/cloudposterior"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    # Sidebar websites size content via the grid (page-layout has no effect here).
    # Widen the body so the output-heavy example notebooks (wide arviz tables,
    # trace plots) have room; custom.scss contains anything still wider.
    grid:
      body-width: 1200px
    toc: true
    code-copy: true
    code-overflow: wrap

quartodoc:
  package: cloudposterior
  dir: reference
  title: API reference
  parser: google
  sections:
    - title: Core
      desc: "The one-line cloud sampling API."
      contents:
        - cloud
        - sample
        - map
        - cleanup_volumes
        - cleanup_cache
    - title: Configuration
      desc: "Right-size the remote VM."
      contents:
        - config.RemoteConfig
    - title: Caching
      desc: "Result caches (in-memory and on-disk)."
      contents:
        - cache.MemoryCache
        - cache.DiskCache
